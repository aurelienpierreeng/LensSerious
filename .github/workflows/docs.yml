name: Docs building

on:
  push:
    branches: [main]
    # Only when something the site is generated FROM changes. A commit that touches
    # only tests or CMake does not need a redeploy.
    paths:
      - 'include/**'
      - 'src/**'
      - 'opencl/**'
      - 'tools/**'
      - 'doc/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer commit supersedes an in-flight build.
concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install deps
        run: sudo apt-get -y install doxygen graphviz

      # doc/doxygen-awesome-css is a submodule and the site is unstyled without it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Doxygen's warnings are the only check this documentation has, and they catch
      # real defects: a doc comment that drifted onto the wrong function after an edit
      # reads perfectly well in the source and is silently wrong on the site. So the
      # build fails on any warning rather than publishing them.
      - name: Doxygen
        run: |
          set -o pipefail
          doxygen doc/Doxyfile 2>&1 | tee doxygen.log
          if grep -qi 'warning' doxygen.log; then
            echo "::error::Doxygen emitted warnings; the site was not published."
            grep -i 'warning' doxygen.log | sed 's/^/::warning::/'
            exit 1
          fi

      - name: Report generated size
        run: |
          {
            echo "### Doxygen output"
            echo '```'
            du -sh doc/api/html
            echo "html files : $(find doc/api/html -name '*.html' | wc -l)"
            echo "svg graphs : $(find doc/api/html -name '*.svg' | wc -l)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/api/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
